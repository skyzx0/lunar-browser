[package]
name = "milky-ray"
version = "1.3.0"
edition = "2021"
description = "Lunar Browser Milky Ray: a fully customizable browser with Lunar Search"
license = "MIT"
publish = false

[dependencies]
lunar-browser = { path = "..", default-features = false }
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
muda = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
