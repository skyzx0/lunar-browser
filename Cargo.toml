[package]
name = "lunar-browser"
version = "1.1.0"
edition = "2021"
description = "An independent web browser with its own engine, an ASCII look and no JavaScript"
license = "MIT"
publish = false

[[bin]]
name = "lunar-browser"
path = "src/main.rs"

[dependencies]
# Window, input and text drawing. Not a web engine: pages are laid out by src/engine.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# TLS for HTTPS and encrypted DNS, with Mozilla's root certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"
# URL parsing and gzip/deflate.
url = "2.5"
flate2 = "1.1"
serde_json = "1.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
