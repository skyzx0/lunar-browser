name: Build Lunar Browser

# Lunar Browser is LibreWolf with Lunar's protections, search engines and
# ASCII look added. This takes LibreWolf's official release for each system,
# checks it against LibreWolf's published checksum, turns it into Lunar
# Browser and publishes everything as one release. About 10 minutes.

on:
  workflow_dispatch:
    inputs:
      librewolf_version:
        description: "LibreWolf version to build from, e.g. 159.0-1 (empty = latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      librewolf: ${{ steps.v.outputs.librewolf }}
    steps:
      - id: v
        run: |
          v="${{ github.event.inputs.librewolf_version }}"
          if [ -z "$v" ]; then
            v=$(curl -sSf "https://codeberg.org/api/v1/repos/librewolf/bsys6/releases?limit=1" | jq -r '.[0].tag_name')
          fi
          echo "LibreWolf $v"
          echo "librewolf=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, system: macos, arch: arm64, file: macos-arm64-package.dmg }
          - { os: macos-latest, system: macos, arch: x86_64, file: macos-x86_64-package.dmg }
          - { os: windows-latest, system: windows, arch: x86_64, file: windows-x86_64-package.zip }
          - { os: windows-latest, system: windows, arch: arm64, file: windows-arm64-package.zip }
          - { os: ubuntu-latest, system: linux, arch: x86_64, file: linux-x86_64-package.tar.xz }
          - { os: ubuntu-latest, system: linux, arch: arm64, file: linux-arm64-package.tar.xz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LW: ${{ needs.version.outputs.librewolf }}
    steps:
      - uses: actions/checkout@v4

      - name: Download LibreWolf
        run: |
          name="librewolf-$LW-${{ matrix.file }}"
          url="https://dl.librewolf.net/librewolf/$LW/$name"
          mkdir -p in
          curl -sSfL -o "in/$name" "$url"
          expected=$(curl -sSfL "$url.sha256sum" | awk '{print $1}')
          actual=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "in/$name" 2>/dev/null ||
                   python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "in/$name")
          echo "expected $expected"
          echo "actual   $actual"
          [ "$expected" = "$actual" ] || { echo "Checksum mismatch: refusing to build."; exit 1; }
          echo "INPUT=in/$name" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: matrix.system == 'macos'
        run: |
          mkdir -p out
          ./scripts/package-mac.sh "$INPUT" "out/lunar-browser-$LW-macos-${{ matrix.arch }}.dmg"

      - name: Build (Windows)
        if: matrix.system == 'windows'
        run: ./scripts/package-windows.sh "$INPUT" "${{ matrix.arch }}" "$LW" out

      - name: Build (Linux)
        if: matrix.system == 'linux'
        run: ./scripts/package-linux.sh "$INPUT" "${{ matrix.arch }}" "$LW" out

      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: lunar-browser-${{ matrix.system }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          LW: ${{ needs.version.outputs.librewolf }}
        run: |
          v="$LW-$(date -u +%Y%m%d-%H%M)"
          cd out
          sha256sum * > SHA256SUMS
          ls -la
          gh release create "browser-$v" ./* -R "$GITHUB_REPOSITORY" \
            --title "Lunar Browser $v (LibreWolf $LW)" \
            --notes "Lunar Browser, based on LibreWolf $LW.
          macOS: open the .dmg (arm64 = Apple Silicon, x86_64 = Intel) and drag Lunar Browser to Applications. It is not notarized, so the first time run: xattr -cr '/Applications/Lunar Browser.app'
          Windows: run the -setup.exe (SmartScreen: More info > Run anyway), or unzip the -portable.zip.
          Linux: sudo apt install ./lunar-browser-*.deb, or unpack the .tar.xz and run lunar-browser/lunar-browser.
          Check downloads against SHA256SUMS."
