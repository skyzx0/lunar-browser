
/** ------------------------------
 * [CATEGORY] LUNAR BROWSER
 * Appended to LibreWolf's own settings by scripts/brand.py. Everything that
 * protects you is lockPref: it is on all the time and can't be switched off,
 * not in Settings, not in about:config, not by an override file.
 * ------------------------------- */

// HTTPS only, everywhere, including private windows.
lockPref("dom.security.https_only_mode", true);
lockPref("dom.security.https_only_mode_pbm", true);
lockPref("dom.security.https_only_mode_ever_enabled", true);
lockPref("security.mixed_content.block_display_content", true);
lockPref("security.tls.version.min", 3); // TLS 1.2 or newer
lockPref("security.ssl.require_safe_negotiation", true);
lockPref("security.cert_pinning.enforcement_level", 2);
lockPref("browser.xul.error_pages.expert_bad_cert", true);

// Encrypted DNS (DNS-over-HTTPS via Quad9), with no plaintext fallback.
lockPref("network.trr.mode", 3);
lockPref("network.trr.uri", "https://dns.quad9.net/dns-query");
lockPref("network.trr.custom_uri", "https://dns.quad9.net/dns-query");
lockPref("network.dns.disablePrefetch", true);
lockPref("network.prefetch-next", false);
lockPref("network.predictor.enabled", false);
lockPref("network.http.speculative-parallel-limit", 0);

// Fingerprinting resistance and tracker blocking.
lockPref("privacy.resistFingerprinting", true);
lockPref("privacy.resistFingerprinting.pbmode", true);
lockPref("privacy.fingerprintingProtection", true);
lockPref("browser.contentblocking.category", "strict");
lockPref("privacy.trackingprotection.enabled", true);
lockPref("privacy.trackingprotection.socialtracking.enabled", true);
lockPref("privacy.trackingprotection.cryptomining.enabled", true);
lockPref("privacy.trackingprotection.fingerprinting.enabled", true);
lockPref("privacy.trackingprotection.emailtracking.enabled", true);
lockPref("privacy.query_stripping.enabled", true);
lockPref("privacy.bounceTrackingProtection.mode", 1);

// Cookies: third parties isolated per site (Total Cookie Protection).
lockPref("network.cookie.cookieBehavior", 5);
lockPref("privacy.partition.network_state", true);
lockPref("privacy.firstparty.isolate", false); // superseded by the above

// Ask sites not to sell or share your data.
lockPref("privacy.globalprivacycontrol.enabled", true);
lockPref("privacy.globalprivacycontrol.functionality.enabled", true);
lockPref("privacy.donottrackheader.enabled", true);

// Cross-site referrers cut to the origin.
lockPref("network.http.referer.XOriginTrimmingPolicy", 2);

// WebRTC can never reveal your local or real IP address.
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.no_host", true);
lockPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);

// Nothing about your browsing survives closing Lunar.
lockPref("privacy.sanitize.sanitizeOnShutdown", true);
lockPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);
lockPref("privacy.clearOnShutdown_v2.cache", true);
lockPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", true);
lockPref("privacy.clearOnShutdown_v2.formdata", true);
lockPref("privacy.clearOnShutdown_v2.siteSettings", false); // keeps what you allowed/blocked
lockPref("browser.sessionstore.resume_from_crash", false);
lockPref("browser.formfill.enable", false);
lockPref("browser.cache.disk.enable", false);

// Devices and sensors: always ask; never silently.
lockPref("permissions.default.geo", 0);
lockPref("permissions.default.camera", 0);
lockPref("permissions.default.microphone", 0);
lockPref("permissions.default.desktop-notification", 2); // notifications blocked
lockPref("dom.webnotifications.enabled", false);
lockPref("dom.push.enabled", false);
lockPref("dom.webmidi.enabled", false);
lockPref("dom.gamepad.enabled", false);
lockPref("dom.vr.enabled", false);
lockPref("device.sensors.enabled", false);
lockPref("beacon.enabled", false);

// Safer downloads: always ask where to save.
lockPref("browser.download.useDownloadDir", false);
lockPref("browser.download.always_ask_before_handling_new_types", true);

// Telemetry and phoning home stay off.
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);

// Lunar's look: the ASCII theme ships inside the app (lunar/ folder next to
// this file) and is applied to every profile, every time Lunar starts.
try {
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
  for (const name of ["lunar-chrome.css", "lunar-content.css"]) {
    const file = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
    file.append("lunar");
    file.append(name);
    const uri = Services.io.newFileURI(file);
    if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {
  Components.utils.reportError("Lunar theme: " + e);
}
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("browser.theme.content-theme", 0);
defaultPref("browser.theme.toolbar-theme", 0);
defaultPref("browser.uidensity", 1);
defaultPref("browser.tabs.inTitlebar", 1);
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("browser.newtabpage.activity-stream.showSearch", true);
// The Settings button sits on the toolbar, next to the address bar.
defaultPref("browser.uiCustomization.state", "{\"placements\":{\"widget-overflow-fixed-list\":[],\"unified-extensions-area\":[],\"nav-bar\":[\"back-button\",\"forward-button\",\"stop-reload-button\",\"home-button\",\"urlbar-container\",\"downloads-button\",\"unified-extensions-button\",\"preferences-button\"],\"toolbar-menubar\":[\"menubar-items\"],\"TabsToolbar\":[\"tabbrowser-tabs\",\"new-tab-button\",\"alltabs-button\"],\"PersonalToolbar\":[\"personal-bookmarks\"]},\"seen\":[\"preferences-button\"],\"dirtyAreaCache\":[],\"currentVersion\":23,\"newElementCount\":0}");
