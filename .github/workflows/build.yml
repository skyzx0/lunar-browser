name: Build Lunar Browser

on:
  workflow_dispatch:
    inputs:
      crawl_minutes:
        description: "Minutes to grow Lunar Search's index (it starts from the last release's)"
        required: false
        default: "170"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, system: mac, arch: aarch64 }
          - { os: macos-latest, system: mac, arch: x86_64 }
          - { os: windows-latest, system: windows, arch: x86_64 }
          - { os: windows-latest, system: windows, arch: aarch64 }
          - { os: ubuntu-latest, system: linux, arch: x86_64 }
          - { os: ubuntu-24.04-arm, system: linux, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          case "${{ matrix.system }}" in
            mac) rustup target add ${{ matrix.arch }}-apple-darwin ;;
            windows) rustup target add ${{ matrix.arch }}-pc-windows-msvc ;;
          esac

      - name: Linux libraries
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.system }}-${{ matrix.arch }}

      - name: Test the engine
        if: matrix.arch == 'x86_64' && matrix.system != 'mac' || matrix.system == 'mac' && matrix.arch == 'aarch64' || matrix.os == 'ubuntu-24.04-arm'
        run: cargo test --release

      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Build and package
        run: ./scripts/package-${{ matrix.system }}.sh ${{ matrix.arch }} "$VERSION" out

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-browser-${{ matrix.system }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  index:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: index

      - name: Build
        run: cargo build --release

      - name: Crawl
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/data
        run: |
          target/release/lunar-browser --crawl 30000 "${{ github.event.inputs.crawl_minutes || '170' }}"
          mkdir -p out
          cp data/lunar-browser/search-index.gz out/lunar-search-index.gz
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-search-index
          path: out/*
          if-no-files-found: error

  publish:
    needs: [build, index]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version-$(date -u +%Y%m%d-%H%M)"
          cd out
          sha256sum * > SHA256SUMS
          ls -la
          gh release create "$tag" ./* -R "$GITHUB_REPOSITORY" \
            --title "Lunar Browser $tag" \
            --notes "Two browsers. Lunar Browser: an independent browser with its own engine (not a fork of anything), an ASCII look and no JavaScript. Lunar Browser Milky Ray (lunar-browser-milky-ray-*): every website and JavaScript through your system's web engine, with an interface you can restyle completely. Both search with Lunar Search, Lunar's own search engine.
          macOS: open the .dmg (arm64 = Apple Silicon, x86_64 = Intel) and drag Lunar Browser to Applications. It isn't notarized, so the first time run: xattr -cr '/Applications/Lunar Browser.app'
          Windows: run the -setup.exe (SmartScreen: More info > Run anyway), or unzip the -portable.zip.
          Linux: sudo apt install ./lunar-browser-*.deb, or unpack the .tar.gz and run lunar-browser.
          Check downloads against SHA256SUMS."
